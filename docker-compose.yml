name: signservice-dev

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  signservice:
    build:
      context: ./ss-dev-src/signservice
      dockerfile: ../../ss-dev-docker/signservice.Dockerfile
    restart: unless-stopped
    environment:
      # Full replacement of the demo-app's classpath application.yml.
      SPRING_CONFIG_LOCATION: file:/etc/signservice/application.yml
      SIGNSERVICE_HOME: /signservice/data
      # SP identity advertised in SAML metadata. Override in .env for your deployment.
      SIGNSERVICE_DOMAIN: ${SIGNSERVICE_DOMAIN:-localhost}
      SIGNSERVICE_BASE_URL: ${SIGNSERVICE_BASE_URL:-https://localhost:8443}
      SIGNSERVICE_SIGN_SERVICE_ID: ${SIGNSERVICE_SIGN_SERVICE_ID:-https://localhost.swedenconnect.se/signservice}
      SIGNSERVICE_SP_ENTITY_ID: ${SIGNSERVICE_SP_ENTITY_ID:-https://signservice.dev.local/sp/integration-rest}
      SIGNSERVICE_SP_DISPLAY_NAME: ${SIGNSERVICE_SP_DISPLAY_NAME:-Dev SignService}
      SIGNSERVICE_SP_ORG_NAME: ${SIGNSERVICE_SP_ORG_NAME:-Dev Organization}
      SIGNSERVICE_SP_ORG_URL: ${SIGNSERVICE_SP_ORG_URL:-https://example.org/}
      SIGNSERVICE_SP_CONTACT_EMAIL: ${SIGNSERVICE_SP_CONTACT_EMAIL:-noreply@example.org}
      VIRTUAL_HOST: ${SIGNSERVICE_DOMAIN:-dev.signservice.edusign.sunet.se}
      VIRTUAL_PROTO: https
      VIRTUAL_PORT: 8443
      LETSENCRYPT_HOST: ${SIGNSERVICE_DOMAIN:-dev.signservice.edusign.sunet.se}
    volumes:
      - ./ss-dev-config/signservice:/etc/signservice:ro
      - ./secrets:/etc/signservice-secrets:ro
      - ./data/signservice:/signservice/data
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  integration-rest:
    build:
      context: ./ss-dev-src/integration-rest
      dockerfile: ../../ss-dev-docker/integration-rest.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      signservice:
        condition: service_started
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/signservice/
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Must match signservice's default-sign-service-id - dev policy reads this.
      SIGNSERVICE_SIGN_SERVICE_ID: ${SIGNSERVICE_SIGN_SERVICE_ID:-https://localhost.swedenconnect.se/signservice}
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true -Dorg.apache.xml.security.ignoreLineBreaks=true"
      VIRTUAL_HOST: ${SIGNAPI_DOMAIN:-dev.signapi.edusign.sunet.se}
      VIRTUAL_PROTO: https
      VIRTUAL_PORT: 8543
      LETSENCRYPT_HOST: ${SIGNAPI_DOMAIN:-dev.signapi.edusign.sunet.se}
    volumes:
      - ./ss-dev-config/integration-rest:/etc/signservice:ro
      - ./secrets:/etc/signservice-secrets:ro
    ports:
      - "127.0.0.1:8543:8443"
      - "127.0.0.1:8549:8449"

  sp:
    build:
      context: nginx
    container_name: edusign-sp
    expose:
      - 80
      - 443
    volumes:
      - edusignlogs:/var/log/edusign:rw
    environment:
      MDQ_BASE_URL: ${MDQ_BASE_URL:-https://mds.swamid.se/qa/}
      MDQ_SIGNER_CERT: ${MDQ_SIGNER_CERT:-md-signer2.crt}
      MDQ_SIGNER_CERT_URL: ${MDQ_SIGNER_CERT_URL:-https://mds.swamid.se/qa/md/swamid-qa.crt}
      MDQ_BASE_URL_EID: ${MDQ_BASE_URL_EID:-https://mds.swamid.se/qa/}
      MDQ_SIGNER_CERT_EID: ${MDQ_SIGNER_CERT_EID:-md-signer2-eid.crt}
      MDQ_SIGNER_CERT_URL_EID: ${MDQ_SIGNER_CERT_URL_EID:-https://mds.swamid.se/qa/md/swamid-qa.crt}
      SP_HOSTNAME: ${SP_HOSTNAME:-dev.edusign.sunet.se}
      DISCO_URL: ${DISCO_URL:-https://service.seamlessaccess.org/ds/?trustProfile=edugain}
      BANKID_ENTITY_ID: ${BANKID_ENTITY_ID:-https://bankidp.qa.swamid.se/bankid/idp}
      FREJA_ENTITY_ID: ${FREJA_ENTITY_ID:-https://idp-sweden-connect-valfr-2017-sandbox.test.frejaeid.com}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-28730982}
      BACKEND_HOST: ${BACKEND_HOST:-edusign-app}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      BACKEND_PROTO: ${BACKEND_PROTO:-http}
      ACME_CHALLENGE_LOCATION: ${ACME_CHALLENGE_LOCATION-x}
      ACME_CHALLENGE_LOCATION_HTTP: ${ACME_CHALLENGE_LOCATION_HTTP-x}
      ACMEPROXY: ${ACMEPROXY-}
      VIRTUAL_HOST: ${SP_HOSTNAME:-dev.edusign.sunet.se}
      VIRTUAL_PROTO: ${VIRTUAL_PROTO:-https}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-443}
      LETSENCRYPT_HOST: ${SP_HOSTNAME:-dev.edusign.sunet.se}
    depends_on:
      - www
      - nginx-acme-companion

  www:
    build:
      context: backend
    container_name: edusign-app
    expose:
      - 8080
    volumes:
      - edusignlogs:/var/log/edusign:rw
    environment:
      SP_HOSTNAME: ${SP_HOSTNAME:-dev.edusign.sunet.se}
      SECRET_KEY: ${SECRET_KEY:-changeme}
      DEBUG: ${DEBUG:-true}
      EDUSIGN_API_BASE_URL: ${EDUSIGN_API_BASE_URL:-https://api.test.edusign.sunet.se/v1/}
      EDUSIGN_API_PROFILE: ${EDUSIGN_API_PROFILE:-edusign-test}
      EDUSIGN_API_USERNAME: ${EDUSIGN_API_USERNAME:-changeme}
      EDUSIGN_API_PASSWORD: ${EDUSIGN_API_PASSWORD:-changeme}
      EDUSIGN_API_PROFILE_11: ${EDUSIGN_API_PROFILE_11:-edusign-test}
      EDUSIGN_API_USERNAME_11: ${EDUSIGN_API_USERNAME_11:-changeme}
      EDUSIGN_API_PASSWORD_11: ${EDUSIGN_API_PASSWORD_11:-changeme}
      EDUSIGN_API_PROFILE_20: ${EDUSIGN_API_PROFILE_20:-edusign-test}
      EDUSIGN_API_USERNAME_20: ${EDUSIGN_API_USERNAME_20:-changeme}
      EDUSIGN_API_PASSWORD_20: ${EDUSIGN_API_PASSWORD_20:-changeme}
      EDUSIGN_API_PROFILE_BANKID: ${EDUSIGN_API_PROFILE_BANKID:-edusign-test-sc}
      EDUSIGN_API_USERNAME_BANKID: ${EDUSIGN_API_USERNAME_BANKID:-changeme}
      EDUSIGN_API_PASSWORD_BANKID: ${EDUSIGN_API_PASSWORD_BANKID:-changeme}
      EDUSIGN_API_PROFILE_FREJA: ${EDUSIGN_API_PROFILE_FREJA:-edusign-test-sc}
      EDUSIGN_API_USERNAME_FREJA: ${EDUSIGN_API_USERNAME_FREJA:-changeme}
      EDUSIGN_API_PASSWORD_FREJA: ${EDUSIGN_API_PASSWORD_FREJA:-changeme}
      SIGNER_ATTRIBUTES: ${SIGNER_ATTRIBUTES:-urn:oid:2.5.4.42,givenName;urn:oid:2.5.4.4,sn}
      SIGN_REQUESTER_ID: ${SIGN_REQUESTER_ID:-https://test.edusign.sunet.se/shibboleth}
      SCOPE_WHITELIST: ${SCOPE_WHITELIST:-sunet.se,nordu.net,eduid.se,auth.gr,dev.eduid.se,umu.se}
      USER_BLACKLIST: ${USER_BLACKLIST:-viduj-vamir@eduid.se}
      POLLING: ${POLLING:-inviter}
      STORAGE_CLASS_PATH: ${STORAGE_CLASS_PATH:-edusign_webapp.document.storage.local.LocalStorage}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://storage.googleapis.com}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-changeme}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-changeme}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-europe-southwest1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-dev-edusign-storage}
      LOCAL_STORAGE_BASE_DIR: ${LOCAL_STORAGE_BASE_DIR:-/tmp}
      DOC_METADATA_CLASS_PATH: ${DOC_METADATA_CLASS_PATH:-edusign_webapp.document.metadata.sqlite.SqliteMD}
      SQLITE_MD_DB_PATH: ${SQLITE_MD_DB_PATH:-/tmp/test.db}
      PG_DB_USER: ${PG_DB_USER:-edusign}
      PG_DB_PASSWORD: ${PG_DB_PASSWORD:-edusign}
      PG_DB_HOST: ${PG_DB_HOST:-postgres}
      PG_DB_PORT: ${PG_DB_PORT:-5432}
      PG_DB_NAME: ${PG_DB_NAME:-edusign}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MAIL_BACKEND: ${MAIL_BACKEND:-smtp}
      MAIL_SERVER: ${MAIL_SERVER:-postfix}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-changeme}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-changeme}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-changeme}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_DEBUG: ${DEBUG:-true}
      MAIL_SUPPRESS_SEND: ${MAIL_SUPPRESS_SEND:-false}
      MAIL_ASCII_ATTACHMENTS: ${MAIL_ASCII_ATTACHMENTS:-false}
      MULTISIGN_BUTTONS: ${MULTISIGN_BUTTONS:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-test-session}
      MAX_DOCUMENT_AGE: ${MAX_DOCUMENT_AGE:-1}
      MAX_SIGNATURES: ${MAX_SIGNATURES:-3}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CUSTOM_COMPANY_LINK: ${CUSTOM_COMPANY_LINK:-https://sunet.se}
      HASH_METHOD: ${HASH_METHOD:-scrypt}
      VALIDATOR_API_BASE_URL: ${VALIDATOR_API_BASE_URL:-https://validator.test.edusign.sunet.se/}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-28730982}
      MAX_FILE_SIZE_FRONT: ${MAX_FILE_SIZE_FRONT:-20971520}
      DEFAULT_LOA: ${DEFAULT_LOA:-low}
      ALLOW_BANKID: ${ALLOW_BANKID:-true}
      BANKID_WHITELIST: ${BANKID_WHITELIST:-sunet.se,eduid.se}
      FREJA_IDP: ${FREJA_IDP:-https://idp-sweden-connect-valfr-2017-sandbox.test.frejaeid.com}
    depends_on:
      - postfix

  postfix:
    image: boky/postfix
    container_name: postfix
    ports:
      - "127.0.0.1:1587:587"
    environment:
      ALLOWED_SENDER_DOMAINS: ${ALLOWED_SENDER_DOMAINS:-dummy.org cazalla.net}

  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 443:443
      - 80:80
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro

  nginx-acme-companion:
    image: nginxproxy/acme-companion
    environment:
      DEFAULT_EMAIL: ${DEFAULT_EMAIL:-android@cazalla.net}
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

volumes:
  # Volume to hold all the interesting logs
  edusignlogs:
    name: edusignlogs
  certs:
    name: certs
  vhost:
    name: vhost
  html:
    name: html
  acme:
    name: acme
