name: signservice-dev

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  signservice:
    build:
      context: ../ss-dev-src/signservice
      dockerfile: ../ss-dev-docker/signservice.Dockerfile
    restart: unless-stopped
    environment:
      # Full replacement of the demo-app's classpath application.yml.
      SPRING_CONFIG_LOCATION: file:/etc/signservice/application.yml
      SIGNSERVICE_HOME: /signservice/data
      # SP identity advertised in SAML metadata. Override in .env for your deployment.
      SIGNSERVICE_DOMAIN: ${SIGNSERVICE_DOMAIN:-localhost}
      SIGNSERVICE_BASE_URL: ${SIGNSERVICE_BASE_URL:-https://localhost:8443}
      SIGNSERVICE_SIGN_SERVICE_ID: ${SIGNSERVICE_SIGN_SERVICE_ID:-https://localhost.swedenconnect.se/signservice}
      SIGNSERVICE_SP_ENTITY_ID: ${SIGNSERVICE_SP_ENTITY_ID:-https://signservice.dev.local/sp/integration-rest}
      SIGNSERVICE_SP_DISPLAY_NAME: ${SIGNSERVICE_SP_DISPLAY_NAME:-Dev SignService}
      SIGNSERVICE_SP_ORG_NAME: ${SIGNSERVICE_SP_ORG_NAME:-Dev Organization}
      SIGNSERVICE_SP_ORG_URL: ${SIGNSERVICE_SP_ORG_URL:-https://example.org/}
      SIGNSERVICE_SP_CONTACT_EMAIL: ${SIGNSERVICE_SP_CONTACT_EMAIL:-noreply@example.org}
    volumes:
      - ./ss-dev-config/signservice:/etc/signservice:ro
      - ./secrets:/etc/signservice-secrets:ro
      - ./data/signservice:/signservice/data
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  integration-rest:
    build:
      context: ../ss-dev-src/integration-rest
      dockerfile: ../ss-dev-docker/integration-rest.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      signservice:
        condition: service_started
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/signservice/
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_REDIS_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Must match signservice's default-sign-service-id - dev policy reads this.
      SIGNSERVICE_SIGN_SERVICE_ID: ${SIGNSERVICE_SIGN_SERVICE_ID:-https://localhost.swedenconnect.se/signservice}
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true -Dorg.apache.xml.security.ignoreLineBreaks=true"
    volumes:
      - ./ss-dev-config/integration-rest:/etc/signservice:ro
      - ./secrets:/etc/signservice-secrets:ro
    ports:
      - "127.0.0.1:8543:8443"
      - "127.0.0.1:8549:8449"

  sp:
    build:
      context: ../nginx
      dockerfile: ../nginx/Dockerfile
    expose:
      - 80
      - 443
    volumes:
      - edusignlogs:/var/log/edusign:rw
    environment:
      - SP_HOSTNAME
      - DISCO_URL
      - MAX_FILE_SIZE
      - METADATA_FILE
    depends_on:
      - www

  # Container that will execute a gunicorn process driving the edusign backen
  # app.

  www:
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile
    expose:
      - 8080
    volumes:
      - edusignlogs:/var/log/edusign:rw
    environment:
      - SP_HOSTNAME
      - SECRET_KEY
      - EDUSIGN_API_BASE_URL
      - EDUSIGN_API_PROFILE
      - EDUSIGN_API_USERNAME
      - EDUSIGN_API_PASSWORD
      - MULTISIGN_BUTTONS
      - SIGN_REQUESTER_ID
      - SIGNER_ATTRIBUTES
      - SCOPE_WHITELIST
      - USER_BLACKLIST
      - STORAGE_CLASS_PATH
      - LOCAL_STORAGE_BASE_DIR
      - AWS_ACCESS_KEY
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION_NAME
      - AWS_BUCKET_NAME
      - DOC_METADATA_CLASS_PATH
      - SQLITE_MD_DB_PATH
      - REDIS_URL
      - MAIL_SERVER
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_DEFAULT_SENDER
      - MAIL_USE_TLS
      - MAIL_USE_SSL
      - MAIL_DEBUG
      - MAIL_SUPPRESS_SEND
      - MAIL_ASCII_ATTACHMENTS

volumes:
  # Volume to hold all the interesting logs
  edusignlogs:
    name: edusignlogs
