#
# Basic-auth users for the dev integration-rest API.
# Hash new passwords with: htpasswd -nbB <user> <password>
#

# admin / admin (cleartext, dev-only)
signservice.user.admin.roles=ADMIN
signservice.user.admin.password={noop}secret

# devclient / devclient
signservice.user.devclient.roles=USER
signservice.user.devclient.policies=dev
signservice.user.devclient.password={noop}secret
