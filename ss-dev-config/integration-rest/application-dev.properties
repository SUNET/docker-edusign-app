#
# Dev override for signservice-integration-rest
# Loaded via SPRING_CONFIG_ADDITIONAL_LOCATION=file:/etc/signservice/
# and SPRING_PROFILES_ACTIVE=dev
#

# Spring property-file references resolve relative to these prefixes.
# Config and secrets live in non-nested bind mounts (see docker-compose.yml) -
# nesting :ro mounts breaks because the inner mount-point can't be mkdir'd.
application.config.prefix=file:/etc/signservice/
application.secrets.prefix=file:/etc/signservice-secrets/

server.port=8443
server.servlet.context-path=/signint

# TLS uses the localhost.jks bundled on the classpath (alias=localhost, password=secret).
server.ssl.enabled=true
server.ssl.key-store=classpath:localhost.jks
server.ssl.key-store-password=secret
server.ssl.key-alias=localhost
server.ssl.key-store-type=JKS

management.server.port=8449
management.endpoints.web.exposure.include=health,info

# Policy + users live next to this file.
signservice.integration.policy-configuration-resource=${application.config.prefix}policy-configuration-dev.properties
signservice.security.user-configuration=${application.config.prefix}signservice-users.properties
signservice.default-policy-name=dev

# Signing credential used to sign DSS SignRequest messages.
# The matching public cert is mounted into the signservice container as a trusted client cert.
signservice.credentials[0].name=DevSigning
signservice.credentials[0].resource=${application.secrets.prefix}integration-rest-signing.p12
signservice.credentials[0].type=PKCS12
signservice.credentials[0].password=changeit
signservice.credentials[0].alias=integration-rest
signservice.credentials[0].key-password=changeit

# SignMessage is a Sweden Connect-specific extension; SWAMID IdPs (the 'dev'
# policy) don't support it. The 'sc' policy (BankID/Freja) COULD use it - the
# signservice's sc engine handles the extension - but enabling it here
# requires integration-rest's own metadata provider for encrypting the
# SignMessage to the IdP (signservice.sign-message.metadata.url +
# .validation-certificate), which only takes a single aggregate URL. In this
# test setup the BankID IdP lives in SWAMID QA and Freja in the Sweden
# Connect test federation, so no single aggregate covers both. Left disabled:
# sign requests then simply carry no SignMessage.
signservice.sign-message.enabled=false

# Caching - Redis is wired up via env vars in docker-compose.yml.
signservice.cache.state.max-age=3600000
signservice.cache.document.max-age=900000

logging.level.se.idsec=DEBUG
logging.level.org.springframework.web=INFO
logging.level.root=WARN
