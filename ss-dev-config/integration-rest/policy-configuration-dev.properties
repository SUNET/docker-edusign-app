signservice.config.sc.pdf-signature-pages[0].pdf-document.resource=${application.config.prefix}dev/pdf/idsec-page.pdf
signservice.config.sc.pdf-signature-pages[0].pdf-document.eagerly-load-contents=true
signservice.config.sc.pdf-signature-pages[0].rows=6
