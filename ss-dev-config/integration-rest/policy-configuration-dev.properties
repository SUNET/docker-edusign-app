#
# Dev policy: targets the local signservice container.
# The signservice's response-signing cert lives at ./secrets/sign-service-cert.pem
# (extracted from signservice/demo-apps/app/src/main/resources/signservice.crt by gen-keys.sh).
#

signservice.config.dev.policy=dev
signservice.config.dev.default-signature-algorithm=http://www.w3.org/2001/04/xmldsig-more#rsa-sha256

# Must match signservice's signservice.engines[].sign-service-id
# (which falls back to signservice.default-sign-service-id). Resolved from the
# SIGNSERVICE_SIGN_SERVICE_ID env var so it can't drift from the value in .env.
signservice.config.dev.sign-service-id=${SIGNSERVICE_SIGN_SERVICE_ID:https://localhost.swedenconnect.se/signservice}

# Where the user-agent will POST the SignRequest. Reach the signservice
# via the host port mapping so the browser can resolve it.
signservice.config.dev.default-destination-url=https://signservice.dev.edusign.sunet.se/sign/integration-rest/signreq

# Default SAML entityID of the calling RP. Override per-request via signRequesterID.
signservice.config.dev.default-sign-requester-id=https://dev.edusign.sunet.se/shibboleth

# The signservice's response-signing certificate (used to verify SignResponse signatures).
signservice.config.dev.sign-service-certificates[0]=${application.secrets.prefix}sign-service-cert.pem
signservice.config.dev.trust-anchors[0]=${application.secrets.prefix}sign-service-cert.pem
# CA root that issues the per-signing-operation user signer certs (the
# BuiltInCa configured in ss-dev-config/signservice/application.yml under
# common-beans.cert.built-in-ca, alias 'test-ca' in
# ss-dev-src/signservice-modules/signservice-app/.../config/ca/test-ca.jks).
# Needed by SimpleCertificateValidator to build a valid chain for the
# signer cert returned in the SignResponse.
signservice.config.dev.trust-anchors[1]=${application.secrets.prefix}signservice-test-ca.crt

signservice.config.dev.signing-credential=DevSigning

# Subject DN fields built from SWAMID/REFEDS attributes delivered by the IdP.
signservice.config.dev.default-certificate-requirements.certificateType=PKC

# eduPersonPrincipalName -> serialNumber
signservice.config.dev.default-certificate-requirements.attribute-mappings[0].sources[0].name=urn:oid:1.3.6.1.4.1.5923.1.1.1.6
signservice.config.dev.default-certificate-requirements.attribute-mappings[0].destination.type=rdn
signservice.config.dev.default-certificate-requirements.attribute-mappings[0].destination.name=2.5.4.5
signservice.config.dev.default-certificate-requirements.attribute-mappings[0].destination.friendly-name=serialNumber
signservice.config.dev.default-certificate-requirements.attribute-mappings[0].destination.required=true

signservice.config.dev.default-certificate-requirements.attribute-mappings[1].sources[0].name=urn:oid:2.5.4.42
signservice.config.dev.default-certificate-requirements.attribute-mappings[1].destination.type=rdn
signservice.config.dev.default-certificate-requirements.attribute-mappings[1].destination.name=2.5.4.42
signservice.config.dev.default-certificate-requirements.attribute-mappings[1].destination.friendly-name=GN
signservice.config.dev.default-certificate-requirements.attribute-mappings[1].destination.required=true

signservice.config.dev.default-certificate-requirements.attribute-mappings[2].sources[0].name=urn:oid:2.5.4.4
signservice.config.dev.default-certificate-requirements.attribute-mappings[2].destination.type=rdn
signservice.config.dev.default-certificate-requirements.attribute-mappings[2].destination.name=2.5.4.4
signservice.config.dev.default-certificate-requirements.attribute-mappings[2].destination.friendly-name=SN
signservice.config.dev.default-certificate-requirements.attribute-mappings[2].destination.required=true

signservice.config.dev.default-certificate-requirements.attribute-mappings[3].sources[0].name=urn:oid:2.16.840.1.113730.3.1.241
signservice.config.dev.default-certificate-requirements.attribute-mappings[3].sources[1].name=urn:oid:2.5.4.3
signservice.config.dev.default-certificate-requirements.attribute-mappings[3].destination.type=rdn
signservice.config.dev.default-certificate-requirements.attribute-mappings[3].destination.name=2.5.4.3
signservice.config.dev.default-certificate-requirements.attribute-mappings[3].destination.friendly-name=CN
signservice.config.dev.default-certificate-requirements.attribute-mappings[3].destination.required=false

signservice.config.dev.default-certificate-requirements.attribute-mappings[4].sources[0].name=urn:oid:2.5.4.6
signservice.config.dev.default-certificate-requirements.attribute-mappings[4].destination.type=rdn
signservice.config.dev.default-certificate-requirements.attribute-mappings[4].destination.name=2.5.4.6
signservice.config.dev.default-certificate-requirements.attribute-mappings[4].destination.friendly-name=C
signservice.config.dev.default-certificate-requirements.attribute-mappings[4].destination.required=false
signservice.config.dev.default-certificate-requirements.attribute-mappings[4].destination.default-value=SE

signservice.config.dev.stateless=false

signservice.config.dev.pdf-signature-image-templates[0].reference=idsec-image
signservice.config.dev.pdf-signature-image-templates[0].svg-image-file.resource=${application.config.prefix}dev/pdf/idsec-image.svg
signservice.config.dev.pdf-signature-image-templates[0].svg-image-file.eagerly-load-contents=true
signservice.config.dev.pdf-signature-image-templates[0].width=967
signservice.config.dev.pdf-signature-image-templates[0].height=351
signservice.config.dev.pdf-signature-image-templates[0].include-signer-name=true
signservice.config.dev.pdf-signature-image-templates[0].include-signing-time=true
signservice.config.dev.pdf-signature-image-templates[0].fields.idp=IdP EntityID

signservice.config.dev.pdf-signature-pages[0].id=idsec-sign-page
signservice.config.dev.pdf-signature-pages[0].pdf-document.resource=${application.config.prefix}dev/pdf/idsec-page.pdf
signservice.config.dev.pdf-signature-pages[0].pdf-document.eagerly-load-contents=true
signservice.config.dev.pdf-signature-pages[0].rows=6
signservice.config.dev.pdf-signature-pages[0].columns=2
signservice.config.dev.pdf-signature-pages[0].signature-image-reference=idsec-image
signservice.config.dev.pdf-signature-pages[0].image-placement-configuration.x-position=37
signservice.config.dev.pdf-signature-pages[0].image-placement-configuration.y-position=165
signservice.config.dev.pdf-signature-pages[0].image-placement-configuration.x-increment=268
signservice.config.dev.pdf-signature-pages[0].image-placement-configuration.y-increment=105
signservice.config.dev.pdf-signature-pages[0].image-placement-configuration.scale=-74

signservice.config.dev.pdf-prepare-settings.allow-remove-encryption-dictionary=true
signservice.config.dev.pdf-prepare-settings.allow-flatten-acro-forms=true
signservice.config.dev.pdf-prepare-settings.enforce-pdfa-consistency=true

#
# SC policy: Sweden Connect-style signing, shared by BOTH BankID and Freja+
# (one policy per identity/certificate profile, not per IdP - the IdP
# entityID and authn context arrive per-request from the webapp). Targets the
# 'integration-rest-sc' engine on the signservice (see the destination URL
# below), which uses the stock sweden-connect SAML handler instead of the
# SUNET Swamid one.
#
# It differs from 'dev' in that the subject DN's serialNumber is populated
# from the Sweden Connect personal identity number attribute
# (urn:oid:1.2.752.29.4.13) rather than from eduPersonPrincipalName.
#
# Federation metadata is wired on the signservice side (see
# signservice.common-beans.saml.metadata-provider in
# ss-dev-config/signservice/application.yml) - this file only governs how
# integration-rest builds the outgoing SignRequest. Note the test-environment
# twist: the Freja IdP lives in the Sweden Connect test federation, but the
# BankID IdP (bankidp.qa.swamid.se) is registered in SWAMID QA (with Sweden
# Connect entity attributes) - the signservice's composite provider covers
# both feeds.
#

signservice.config.sc.policy=sc
signservice.config.sc.default-signature-algorithm=http://www.w3.org/2001/04/xmldsig-more#rsa-sha256

signservice.config.sc.sign-service-id=${SIGNSERVICE_SIGN_SERVICE_ID:https://localhost.swedenconnect.se/signservice}
# Targets the Sweden Connect-style engine (its processing path selects the
# engine on the signservice side).
signservice.config.sc.default-destination-url=https://signservice.dev.edusign.sunet.se/sign/integration-rest-sc/signreq
signservice.config.sc.default-sign-requester-id=https://dev.edusign.sunet.se/shibboleth

signservice.config.sc.sign-service-certificates[0]=${application.secrets.prefix}sign-service-cert.pem
signservice.config.sc.trust-anchors[0]=${application.secrets.prefix}sign-service-cert.pem
signservice.config.sc.trust-anchors[1]=${application.secrets.prefix}signservice-test-ca.crt

signservice.config.sc.signing-credential=DevSigning

signservice.config.sc.default-certificate-requirements.certificateType=PKC

# Sweden Connect personalIdentityNumber -> serialNumber
signservice.config.sc.default-certificate-requirements.attribute-mappings[0].sources[0].name=urn:oid:1.2.752.29.4.13
signservice.config.sc.default-certificate-requirements.attribute-mappings[0].destination.type=rdn
signservice.config.sc.default-certificate-requirements.attribute-mappings[0].destination.name=2.5.4.5
signservice.config.sc.default-certificate-requirements.attribute-mappings[0].destination.friendly-name=serialNumber
signservice.config.sc.default-certificate-requirements.attribute-mappings[0].destination.required=true

signservice.config.sc.default-certificate-requirements.attribute-mappings[1].sources[0].name=urn:oid:2.5.4.42
signservice.config.sc.default-certificate-requirements.attribute-mappings[1].destination.type=rdn
signservice.config.sc.default-certificate-requirements.attribute-mappings[1].destination.name=2.5.4.42
signservice.config.sc.default-certificate-requirements.attribute-mappings[1].destination.friendly-name=GN
signservice.config.sc.default-certificate-requirements.attribute-mappings[1].destination.required=true

signservice.config.sc.default-certificate-requirements.attribute-mappings[2].sources[0].name=urn:oid:2.5.4.4
signservice.config.sc.default-certificate-requirements.attribute-mappings[2].destination.type=rdn
signservice.config.sc.default-certificate-requirements.attribute-mappings[2].destination.name=2.5.4.4
signservice.config.sc.default-certificate-requirements.attribute-mappings[2].destination.friendly-name=SN
signservice.config.sc.default-certificate-requirements.attribute-mappings[2].destination.required=true

signservice.config.sc.default-certificate-requirements.attribute-mappings[3].sources[0].name=urn:oid:2.16.840.1.113730.3.1.241
signservice.config.sc.default-certificate-requirements.attribute-mappings[3].sources[1].name=urn:oid:2.5.4.3
signservice.config.sc.default-certificate-requirements.attribute-mappings[3].destination.type=rdn
signservice.config.sc.default-certificate-requirements.attribute-mappings[3].destination.name=2.5.4.3
signservice.config.sc.default-certificate-requirements.attribute-mappings[3].destination.friendly-name=CN
signservice.config.sc.default-certificate-requirements.attribute-mappings[3].destination.required=false

signservice.config.sc.default-certificate-requirements.attribute-mappings[4].sources[0].name=urn:oid:2.5.4.6
signservice.config.sc.default-certificate-requirements.attribute-mappings[4].destination.type=rdn
signservice.config.sc.default-certificate-requirements.attribute-mappings[4].destination.name=2.5.4.6
signservice.config.sc.default-certificate-requirements.attribute-mappings[4].destination.friendly-name=C
signservice.config.sc.default-certificate-requirements.attribute-mappings[4].destination.required=false
signservice.config.sc.default-certificate-requirements.attribute-mappings[4].destination.default-value=SE

signservice.config.sc.stateless=false

signservice.config.sc.pdf-signature-image-templates[0].reference=idsec-image
signservice.config.sc.pdf-signature-image-templates[0].svg-image-file.resource=${application.config.prefix}dev/pdf/idsec-image.svg
signservice.config.sc.pdf-signature-image-templates[0].svg-image-file.eagerly-load-contents=true
