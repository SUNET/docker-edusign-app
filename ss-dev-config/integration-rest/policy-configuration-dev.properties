signservice.config.sc.pdf-signature-pages[0].image-placement-configuration.x-position=37
signservice.config.sc.pdf-signature-pages[0].image-placement-configuration.y-position=165
signservice.config.sc.pdf-signature-pages[0].image-placement-configuration.x-increment=268
