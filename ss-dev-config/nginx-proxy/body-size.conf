# Mounted into nginx-proxy as /etc/nginx/conf.d/body-size.conf, see
# docker-compose.yml. Without it nginx-proxy limits a request body to nginx's
# default of 1m, and answers 413 to the upload of a larger document.
#
# The exact limit is enforced by the sp container, from MAX_FILE_SIZE. This
# value only has to be at least MAX_FILE_SIZE. Raise it if MAX_FILE_SIZE goes
# above 64 MiB (67108864).
client_max_body_size 64m;
